[project]
name = "mojo-pyroaring"
version = "0.1.0"
description = "Roaring bitmaps with Mojo-compiled container kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "roaring-bitmap", "bitmap", "set"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pyroaring"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
